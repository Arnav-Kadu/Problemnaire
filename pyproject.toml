[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "problemnaire"
version = "0.1.0"
description = "CLI tool that analyzes your coding profiles and tells you what to improve to gain +200 rating"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
]

[project.scripts]
problemnaire = "problemnaire.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["problemnaire"]
